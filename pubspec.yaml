name: frete_antt
description: Calculadora de piso mínimo de frete ANTT para caminhoneiros autônomos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP — para OSRM e Nominatim (OpenStreetMap)
  http: ^1.2.0

  # Armazenamento local — perfil e histórico sem login
  shared_preferences: ^2.2.2

  # Geração de PDF profissional
  pdf: ^3.10.8
  printing: ^5.12.0

  # Compartilhar PDF via WhatsApp
  share_plus: ^7.2.2

  # Fontes Google (Inter + RobotoMono)
  google_fonts: ^6.1.0

  # Diretório temporário para salvar PDF
  path_provider: ^2.1.2

  # Anúncios Google AdMob (versão gratuita)
  google_mobile_ads: ^5.1.0

  # Compra in-app — desbloqueio Pro
  in_app_purchase: ^3.2.0

  # Ícones extras
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/



